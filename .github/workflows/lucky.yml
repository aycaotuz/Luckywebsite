name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Workaround npm optional-deps/native-binding issue
        run: |
          # Remove lockfile and node_modules as recommended by the error you saw
          rm -f package-lock.json
          rm -rf node_modules

      - name: Install dependencies
        run: npm install
        # Alternative (skip optional deps) if you prefer:
        # run: npm install --no-optional

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
